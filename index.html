<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story | 2 Years</title>
  <meta name="description" content="Our love story — 2 years of us.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ========== SPLASH SCREEN ========== -->
  <div id="splash-screen" class="active">
    <div class="splash-bg"></div>
    <div class="splash-content">
      <div class="splash-logo">
        <span class="logo-letter">O</span>
        <span class="logo-letter">U</span>
        <span class="logo-letter">R</span>
        <span class="logo-letter">S</span>
        <span class="logo-letter">T</span>
        <span class="logo-letter">O</span>
        <span class="logo-letter">R</span>
        <span class="logo-letter">Y</span>
      </div>
      <p class="splash-tagline">2 Years of Us</p>
      <div class="splash-note">
        <p id="opening-note">PLACEHOLDER_OPENING_NOTE</p>
      </div>
      <button id="enter-btn" class="btn-play splash-enter">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="4,2 20,12 4,22"></polygon></svg>
        Start Watching
      </button>
    </div>
  </div>

  <!-- ========== BROWSE PAGE ========== -->
  <div id="browse-page">

    <!-- Navbar -->
    <nav id="navbar">
      <div class="nav-left">
        <a href="#" class="nav-logo">OURSTORY</a>
        <ul class="nav-links">
          <li><a href="#" class="nav-link active">Home</a></li>
          <li><a href="#" class="nav-link">Our Series</a></li>
          <li><a href="#" class="nav-link">My List</a></li>
        </ul>
      </div>
      <div class="nav-right">
        <span class="nav-badge">2 YEARS ❤️</span>
      </div>
    </nav>

    <!-- Hero Banner -->
    <section id="hero-section">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <p class="hero-series-badge">O U R S T O R Y</p>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-description" id="hero-description"></p>
        <div class="hero-buttons">
          <button id="hero-play-btn" class="btn btn-play">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="4,2 20,12 4,22"></polygon></svg>
            Play
          </button>
          <button id="hero-info-btn" class="btn btn-info">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            More Info
          </button>
        </div>
      </div>
    </section>

    <!-- Content Rows -->
    <div id="rows-container">
      <!-- Rows are dynamically generated by app.js -->
    </div>

  </div>

  <!-- ========== DETAIL MODAL ========== -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close" class="modal-close-btn">&times;</button>
      <div class="modal-hero">
        <img id="modal-hero-img" src="" alt="">
        <div class="modal-hero-gradient"></div>
        <div class="modal-hero-content">
          <h2 id="modal-title" class="modal-title"></h2>
          <div class="modal-hero-buttons">
            <button id="modal-play-all" class="btn btn-play">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="4,2 20,12 4,22"></polygon></svg>
              Play
            </button>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-info">
          <span id="modal-match" class="modal-match"></span>
          <span id="modal-year" class="modal-year"></span>
          <span id="modal-episode-count" class="modal-episode-count"></span>
        </div>
        <div class="modal-genre" id="modal-genre"></div>
        <p id="modal-description" class="modal-description"></p>
        <h3 class="episodes-heading">Episodes</h3>
        <div id="modal-episodes-grid" class="episodes-grid">
          <!-- Episodes populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- ========== GALLERY / PLAYER ========== -->
  <div id="gallery-overlay" class="gallery-overlay">
    <button id="gallery-close" class="gallery-close-btn">&times;</button>
    <div id="gallery-counter" class="gallery-counter"></div>
    <div class="gallery-media-container">
      <img id="gallery-image" src="" alt="">
      <video id="gallery-video" controls playsinline></video>
    </div>
    <button id="gallery-prev" class="gallery-nav-btn gallery-prev">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button id="gallery-next" class="gallery-nav-btn gallery-next">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
    <div id="gallery-progress" class="gallery-progress">
      <div id="gallery-progress-bar" class="gallery-progress-bar"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
